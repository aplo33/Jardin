name: jardin_app
description: Application de gestion de jardin d'agrément et potager
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  provider: ^6.1.1
  
  # Database
  #hive: ^4.2.1
  #hive_flutter: ^1.1.0
  hive: ^4.0.0
  hive_flutter: ^1.1.0  # Extension pour Flutter

  # UI Components
  flutter_slidable: ^3.0.0
  intl: ^0.20.3
  date_picker_plus: ^3.0.0
  
  # Icons
  cupertino_icons: ^1.0.2
  flutter_iconpicker: ^3.2.0
  
  # Navigation
  go_router: ^13.0.0
  
  # Storage
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  
  # Images
  image_picker: ^1.0.4
  
  # Charts for statistics
  fl_chart: ^0.63.0
  
  # Notifications
  flutter_local_notifications: ^16.1.2
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/data/
  
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700