repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9 # version de Ruff
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        stages: [pre-push]
 
      - id: pytest
        name: pytest 
        entry: pytest
        language: system
        pass_filenames: false          